[project]
name = "daimon-agent"
version = "0.1.0"
description = "Daimon's agent harness — a LangGraph agent (DeepSeek V4 Pro/Flash) for coding, browsing, and research"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-deepseek>=0.2",
    "langchain-core",
    "aiohttp>=3.10",
    "aiosqlite>=0.20",
    "jupyter-client>=8",
    "ipykernel>=6.29",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
daimon-agent = "daimon_agent.server:main"
daimon-chat = "daimon_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daimon_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: requires a live PinchTab server (set PINCHTAB_BASE)",
]
