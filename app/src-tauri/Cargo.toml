[package]
name = "daimon-app"
version = "1.0.0"
description = "Daimon chat app"
edition = "2021"

[lib]
name = "daimon_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "time", "sync", "rt", "fs", "io-util", "signal"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# kill(-pgid) — the agent spawns ipykernel children, so a plain child-kill
# would orphan the kernel; group-kill takes them all down with the leader.
libc = "0.2"
# Embedded terminals (terminal.rs) — base64 for the pty output framing,
# portable-pty for the PTY itself.
base64 = "0.22"
portable-pty = "0.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
# Native NSVisualEffectView "liquid glass" behind the transparent pill/panel
# webview — the real, OS-composited desktop blur that updates live as the
# window moves (unlike CSS backdrop-filter, which freezes its captured
# backdrop on a moving transparent window). See vibrancy.rs.
window-vibrancy = "0.6"
# MainThreadMarker guard before AppKit calls in vibrancy.rs (window-vibrancy
# pulls objc2 itself, but calling it directly needs it as a direct dep).
objc2 = "0.6.4"
# Voice dictation — on-device whisper.cpp via whisper-rs, mic capture via cpal.
whisper-rs = "0.16.0"
cpal = "0.18.1"
# Fn-key global monitor (fn_key.rs): block-based NSEvent handlers, haptics,
# and the Accessibility trust check.
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSEvent", "NSHapticFeedback", "NSApplication", "NSResponder", "block2"] }
objc2-foundation = "0.3.2"
log = "0.4"
# For vault.rs: data_dir() and RFC3339 time formatting
dirs-next = "2"
chrono = "0.4"
